#
# Hyprlock - Thème Rose Pine
# https://rosepinetheme.com/
#

# Palette Rose Pine (base)
# base    = 25, 23, 36   (#191724)
# surface = 31, 29, 46   (#1f1d2e)
# overlay = 38, 35, 58   (#26233a)
# muted   = 110, 106, 134 (#6e6a86)
# subtle  = 144, 140, 170 (#908caa)
# text    = 224, 222, 244 (#e0def4)
# love    = 235, 111, 146 (#eb6f92)
# gold    = 246, 193, 119 (#f6c177)
# rose    = 235, 188, 186 (#ebbcba)
# pine    = 49, 116, 143  (#31748f)
# foam    = 156, 207, 216 (#9ccfd8)
# iris    = 196, 167, 231 (#c4a7e7)

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.6
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Anneau extérieur avec dégradé Iris -> Foam
input-field {
    monitor =
    size = 260, 60
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(196, 167, 231)
    inner_color = rgb(31, 29, 46)
    font_color = rgb(224, 222, 244)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##908caa">Mot de passe...</span>
    hide_input = false
    rounding = -1
    check_color = rgb(156, 207, 216)
    fail_color = rgb(235, 111, 146)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgb(246, 193, 119)
    position = 0, -47
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# Horloge
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(224, 222, 244)
    font_size = 90
    font_family = JetBrains Mono Nerd Font, monospace
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A %d %B")"
    color = rgb(144, 140, 170)
    font_size = 22
    font_family = JetBrains Mono Nerd Font, monospace
    position = 0, 60
    halign = center
    valign = center
}

# Nom d'utilisateur
label {
    monitor =
    text = Bonjour, $USER
    color = rgb(235, 188, 186)
    font_size = 20
    font_family = JetBrains Mono Nerd Font, monospace
    position = 0, -150
    halign = center
    valign = center
}
